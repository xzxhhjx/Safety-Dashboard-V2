gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
gzip_min_length 1000;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React static files — SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to Fastify backend
    location /api/ {
        proxy_pass http://fastify:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering for streaming responses (e.g. upload progress)
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Uploads — served directly by Nginx for performance
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
